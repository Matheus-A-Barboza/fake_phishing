<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portal de Treinamento</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #edf1f7;
            font-family: Arial, sans-serif
        }

        .login {
            background: white;
            padding: 35px;
            width: 360px;
            max-width: 85vw;
            border-radius: 12px;
            box-shadow: 0 8px 30px #0002
        }

        input,
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border-radius: 6px;
            font-size: 15px
        }

        input {
            border: 1px solid #ccc
        }

        button {
            background: #2358d5;
            color: white;
            border: 0;
            cursor: pointer
        }

        small {
            color: #666
        }
    </style>
</head>

<body>
    <main class="login">
        <h2>Segurança Cibernética</h2>
        <p>Treine sua capacidade de identificar e prevenir ameaças cibernéticas.</p>
        <form id="loginForm"><input id="usuario" placeholder="Usuário" autocomplete="off" required><input
                id="senha" type="password" placeholder="Senha" autocomplete="off" required><button
                type="submit">Entrar</button></form><small>Após o cadastro, você será redirecionado para a página de resultados.</small>
    </main>
    <script>document.getElementById('loginForm').addEventListener('submit', function (e) { e.preventDefault(); const registro = { usuario: document.getElementById('usuario').value, senhaPreenchida: document.getElementById('senha').value.length > 0, dataHora: new Date().toISOString(), evento: 'tentativa_login_simulada' }; const historico = JSON.parse(localStorage.getItem('registrosTreinamento') || '[]'); historico.push(registro); localStorage.setItem('registrosTreinamento', JSON.stringify(historico)); this.reset(); window.location.href = 'resultado.html'; });</script>
</body>

</html>
